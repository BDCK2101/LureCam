plugins { 
    id 'com.android.application' 
} 
android { 
    namespace 'com.example.lurecam' 
    compileSdk 34 
    defaultConfig { 
        applicationId "com.example.lurecam" 
        minSdk 24 
        targetSdk 34 
        versionCode 1 
        versionName "1.0" 
    } 
    buildTypes { 
        release { 
            signingConfig signingConfigs.debug 
        } 
    } 
} 
dependencies { 
    implementation 'androidx.appcompat:appcompat:1.6.1' 
} 
